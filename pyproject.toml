[project]
name = "trader"
version = "0.1.0"
description = "Advisory crypto trading bot that analyzes TradingView technical signals across timeframes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tradingview-ta>=3.3.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
    "rich>=13.0",
    "ccxt>=4.0",
    "pandas>=2.0",
    "ta>=0.11",
]

[project.scripts]
trader = "trader.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# numpy (transitive via pandas) ships PEP 695 `type`-statement stubs that require a
# 3.12+ analysis target; the runtime still supports 3.11 (see requires-python).
python_version = "3.12"
strict = true

# ccxt and ta ship no type information; allow importing them under --strict.
[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*", "ta", "ta.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
